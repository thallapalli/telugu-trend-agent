name: Daily generate

on:
  schedule:
    - cron: "30 0 * * *" # 06:00 IST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate posts
        env:
          PYTHONPATH: src
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          POSTS_PER_DAY: ${{ vars.POSTS_PER_DAY || '3' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
        run: python -m telugu_agent generate
      - name: Commit data
        run: |
          git config user.name "telugu-agent-bot"
          git config user.email "telugu-agent-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "data: daily posts" && git pull --rebase && git push)
