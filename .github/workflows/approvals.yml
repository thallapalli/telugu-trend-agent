name: Process approvals

on:
  # Instant path: the Vercel webhook commits data/decisions/<id>.json when you tap Approve/Reject in Telegram.
  push:
    branches: [main]
    paths: ["data/decisions/**"]
  # Safety net: retries failed publishes, and polls Telegram if no webhook is set up.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Runs are serialized so two runs never publish the same post. GitHub keeps only one waiting run, which is
# fine: every run processes ALL pending decisions and ALL approved posts, so a skipped run loses nothing.
concurrency:
  group: agent-data
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # always the latest state, never the (possibly stale) commit that triggered the run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply decisions and publish approved posts
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HACKS_USER_ID: ${{ secrets.IG_HACKS_USER_ID }}
          IG_HACKS_ACCESS_TOKEN: ${{ secrets.IG_HACKS_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v24.0' }}
        run: python -m telugu_agent approvals
      # always(): even if a later post fails, the state of posts already published must be saved,
      # otherwise the next run would publish them to Instagram a second time.
      - name: Commit data
        if: always()
        run: |
          git config user.name "telugu-agent-bot"
          git config user.email "telugu-agent-bot@users.noreply.github.com"
          git add -A data
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "data: approvals"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
