name: Process approvals

on:
  schedule:
    - cron: "*/30 * * * *" # poll Telegram for approve/reject taps
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-data
  cancel-in-progress: false

jobs:
  approvals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Handle button taps
        env:
          PYTHONPATH: src
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python -m telugu_agent approvals
      - name: Commit data
        run: |
          git config user.name "telugu-agent-bot"
          git config user.email "telugu-agent-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "data: approvals" && git pull --rebase && git push)
